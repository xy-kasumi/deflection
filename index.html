<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deflection</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="form-panel">
        <h1>Beam</h1>
        <form id="beam-form" autocomplete="off">
          <label>
            <span>Material</span>
            <select name="material">
              <option value="PLA">Printed PLA</option>
              <option value="AL">Aluminum</option>
              <option value="STEEL" selected>Steel</option>
            </select>
            <small class="material-info" id="material-info"></small>
          </label>
          <label>
            <span>Beam type</span>
            <select name="beamType">
              <option value="cantilever" selected>Cantilever (tip load)</option>
              <option value="simply-supported">Simply supported (center load)</option>
            </select>
          </label>
          <label>
            <span>Length L (mm)</span>
            <input type="number" name="L_mm" step="any" value="300" />
          </label>
          <label>
            <span>I<sub>x</sub> (mm⁴)</span>
            <input type="number" name="Ix_mm4" step="any" value="1000" />
          </label>
          <label>
            <span>I<sub>y</sub> (mm⁴)</span>
            <input type="number" name="Iy_mm4" step="any" value="1000" />
          </label>
          <label>
            <span>J — torsion (mm⁴)</span>
            <input type="number" name="J_mm4" step="any" value="800" />
          </label>
          <label>
            <span>Force (kgf)</span>
            <input type="number" name="force_kgf" step="any" value="1" />
          </label>
        </form>
        <div id="readout">
          <div class="line"><span class="lbl">δ peak</span><span class="val" id="readout-delta">—</span></div>
          <div id="scale-buttons">
            <button type="button" data-scale="1">×1</button>
            <button type="button" data-scale="10">×10</button>
            <button type="button" data-scale="100">×100</button>
            <button type="button" data-scale="1000">×1000</button>
          </div>
        </div>
      </aside>
      <main id="canvas-panel">
        <canvas id="canvas"></canvas>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
